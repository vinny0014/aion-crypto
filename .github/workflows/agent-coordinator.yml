name: AION agent coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: aion-agent-coordinator
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover stale work and dispatch the next Manus task
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          # This POST is intentionally not retried. A failed dispatch is recovered
          # by the next scheduled tick so one run cannot consume multiple attempts.
          curl --fail-with-body --silent --show-error \
            --max-time 40 \
            -X POST \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/coordination-tick.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tick
          jq -e '.status == "dispatched" or .status == "idle" or .status == "requeued"' /tmp/coordination-tick.json >/dev/null
          jq -r '"AION coordinator: \(.status)"' /tmp/coordination-tick.json

      - name: Publish safe heartbeat summary
        if: always()
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 40 \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/coordination-status.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/status
          {
            echo "### AION bridge heartbeat"
            echo ""
            echo "- Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            counts="$(jq -c '.counts // {}' /tmp/coordination-status.json)"
            echo "- Counts: \`$counts\`"
            echo "- Active:"
            jq -r '.tasks[:10][]? | "  - #\(.id) status=\(.status) actor=\(.current_actor) attempts=\(.attempts)/\(.max_attempts) heartbeat=\(.heartbeat_at // "none")"' /tmp/coordination-status.json
          } >> "$GITHUB_STEP_SUMMARY"
