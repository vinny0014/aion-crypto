name: AION agent coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: aion-agent-coordinator
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Recover stale work and dispatch the next Manus task
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --max-time 40 \
            -X POST \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/coordination.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tick
          status="$(jq -r '.status // "unknown"' /tmp/coordination.json)"
          test "$status" = "dispatched" -o "$status" = "idle"
          echo "AION coordinator: $status"
