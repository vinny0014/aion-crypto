name: Manus command bridge

on:
  push:
    branches: ["codex/aion-crypto-production-review"]
  workflow_dispatch:
    inputs:
      command:
        description: Single command to send to the persistent Manus agent
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manus-command-bridge
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Queue durable Manus mission
        env:
          MANUS_COMMAND: ${{ inputs.command }}
          PRODUCTION_SHA: ${{ github.sha }}
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          if [ -z "$MANUS_COMMAND" ]; then
            MANUS_COMMAND="TASK_ID=AION-ADSENSE-CONTENT-VALUE; deploy and validate aioncrypto.cloud after production SHA=$PRODUCTION_SHA; this cycle remediates Google's low-value-content finding; keep Auto Ads OFF and DO NOT request a new AdSense review; verify unique home story placement, at least 20 substantial AION Explained guides, six strong coin pillars, visible primary references/review dates/risks, internal links, Article/Breadcrumb/FAQ structured data, sitemap and indexability, desktop/mobile 360/390/412, HTTP, console, network and performance; verify automated news remains source-bound and weak drafts are held by the quality gate; record evidence in GitHub issues #35 and #38 and return only concrete findings through the coordination callback."
            IDEMPOTENCY_KEY="production:$PRODUCTION_SHA"
            TASK_TITLE="Validate AION production $PRODUCTION_SHA"
          else
            IDEMPOTENCY_KEY="manual:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            TASK_TITLE="AION manual Manus mission"
          fi
          payload="$(jq -n \
            --arg key "$IDEMPOTENCY_KEY" \
            --arg title "$TASK_TITLE" \
            --arg instructions "$MANUS_COMMAND" \
            '{idempotency_key:$key,title:$title,instructions:$instructions,actor:"manus",max_attempts:6}')"
          curl --fail-with-body --silent --show-error \
            --max-time 35 \
            -H "Content-Type: application/json" \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --data "$payload" \
            --output /tmp/manus-create.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tasks
          jq -e '.status == "created" or .status == "duplicate"' /tmp/manus-create.json >/dev/null
          echo "AION Manus mission queued: $IDEMPOTENCY_KEY"

      - name: Dispatch queued Manus mission now
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --max-time 40 \
            -X POST \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/manus-dispatch.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tick
          status="$(jq -r '.status // "unknown"' /tmp/manus-dispatch.json)"
          test "$status" = "dispatched" -o "$status" = "idle"
          echo "AION Manus dispatch: $status"
