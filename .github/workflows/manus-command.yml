name: Manus command bridge

on:
  push:
    branches: ["codex/aion-crypto-production-review"]
  workflow_dispatch:
    inputs:
      command:
        description: Single command to send to the persistent Manus agent
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manus-command-bridge
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out bridge instructions
        uses: actions/checkout@v4

      - name: Wait for retry-safe coordination backend
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 20 \
              https://aion-crypto-api.onrender.com/health/ready \
              | jq -e '.status == "ready" and .coordination_dispatch_retry == true' >/dev/null; then
              echo "Retry-safe coordination backend is live"
              exit 0
            fi
            echo "Waiting for Render deploy ($attempt/90)"
            sleep 20
          done
          echo "Retry-safe coordination backend did not become ready" >&2
          exit 1

      - name: Queue durable Manus mission
        env:
          MANUS_COMMAND: ${{ inputs.command }}
          PRODUCTION_SHA: ${{ github.sha }}
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          if [ -z "$MANUS_COMMAND" ]; then
            MANUS_COMMAND="$(sed "s/{{PRODUCTION_SHA}}/$PRODUCTION_SHA/g" .github/manus/aion-adsense-continuous-loop.md)"
            IDEMPOTENCY_KEY="production:$PRODUCTION_SHA"
            TASK_TITLE="Validate AION production $PRODUCTION_SHA"
          else
            IDEMPOTENCY_KEY="manual:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            TASK_TITLE="AION manual Manus mission"
          fi
          payload="$(jq -n \
            --arg key "$IDEMPOTENCY_KEY" \
            --arg title "$TASK_TITLE" \
            --arg instructions "$MANUS_COMMAND" \
            '{idempotency_key:$key,title:$title,instructions:$instructions,actor:"manus",max_attempts:12}')"
          curl --fail-with-body --silent --show-error \
            --max-time 35 \
            -H "Content-Type: application/json" \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --data "$payload" \
            --output /tmp/manus-create.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tasks
          jq -e '.status == "created" or .status == "duplicate"' /tmp/manus-create.json >/dev/null
          jq -r '"AION Manus mission queued: task=\(.task.id) status=\(.task.status) actor=\(.task.current_actor)"' /tmp/manus-create.json

      - name: Dispatch queued Manus mission now
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 40 \
            -X POST \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/manus-dispatch.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/tick
          status="$(jq -r '.status // "unknown"' /tmp/manus-dispatch.json)"
          test "$status" = "dispatched" -o "$status" = "idle"
          echo "AION Manus dispatch: $status"

      - name: Report protected coordination state
        if: always()
        env:
          SCHEDULER_TOKEN: ${{ secrets.AION_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 40 \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN" \
            --output /tmp/manus-status.json \
            https://aion-crypto-api.onrender.com/internal/manus/coordination/status
          {
            echo "### AION coordination status"
            jq -r '"Counts: `\(.counts)`", "", "Recent tasks:", (.recent[:5][] | "- #\(.id) `\(.status)` actor=`\(.current_actor)` attempts=\(.attempts)/\(.max_attempts) updated=\(.updated_at)")' /tmp/manus-status.json
          } >> "$GITHUB_STEP_SUMMARY"
